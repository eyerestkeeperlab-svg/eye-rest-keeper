<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#3B8C4B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="20-20-20">
<title>20-20-20 目の休憩タイマー</title>
<style>
:root {
  --bg:      #080d0a;
  --bg2:     #0f1812;
  --bg3:     #162019;
  --border:  #1e3028;
  --accent:  #3B8C4B;
  --accent2: #4fa862;
  --warn:    #c4861a;
  --danger:  #c44a3a;
  --text1:   #e8f0ea;
  --text2:   #7ea88a;
  --text3:   #3a6048;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  font-family: -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
  background: var(--bg);
  color: var(--text1);
  overflow: hidden;
}
.app {
  height: 100%;
  display: flex;
  flex-direction: column;
  max-width: 480px;
  margin: 0 auto;
  padding: env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
}

/* Header */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px 10px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.header-title { font-size: 15px; font-weight: 600; color: var(--text1); }
.header-rule {
  font-size: 11px;
  color: var(--accent);
  border: 1px solid var(--accent);
  padding: 3px 10px;
  border-radius: 99px;
  letter-spacing: 0.05em;
}
.sound-toggle {
  font-size: 12px; color: var(--text2);
  background: none; border: none; cursor: pointer;
  padding: 4px 8px; border-radius: 8px;
}
.sound-toggle.on { color: var(--accent); }

/* Content */
.content {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
  -webkit-overflow-scrolling: touch;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Main ring */
.ring-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px 0 12px;
  width: 100%;
}
.ring-svg { width: 200px; height: 200px; }
.status-text {
  font-size: 13px;
  color: var(--text2);
  text-align: center;
  margin-top: 8px;
}

/* Rule display */
.rule-cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  width: 100%;
  margin-bottom: 16px;
}
.rule-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 8px;
  text-align: center;
}
.rule-card.active { border-color: var(--accent); background: #0f2018; }
.rule-num {
  font-size: 32px;
  font-weight: 300;
  color: var(--accent);
  line-height: 1;
  margin-bottom: 4px;
  font-variant-numeric: tabular-nums;
}
.rule-unit { font-size: 11px; color: var(--text2); }
.rule-desc { font-size: 10px; color: var(--text3); margin-top: 3px; }

/* Alert */
.alert {
  background: #1a2a14;
  border: 1px solid var(--accent);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 13px;
  color: #7ed88a;
  margin-bottom: 12px;
  display: none;
  width: 100%;
  text-align: center;
}
.alert.show { display: block; }

/* Buttons */
.btn-row {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
  width: 100%;
}
.btn {
  flex: 1;
  padding: 13px 8px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--bg2);
  color: var(--text1);
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
  transition: opacity 0.15s;
}
.btn:active { opacity: 0.7; }
.btn.primary { background: var(--accent); border-color: var(--accent); font-weight: 600; }
.btn.sm { padding: 9px 14px; font-size: 13px; flex: none; }

/* Break panel */
.break-panel {
  display: none;
  width: 100%;
  text-align: center;
}
.break-panel.show { display: block; }
.break-title {
  font-size: 22px;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 8px;
}
.break-instruction {
  font-size: 14px;
  color: var(--text2);
  line-height: 1.8;
  margin-bottom: 16px;
  padding: 14px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
}
.break-instruction strong { color: var(--accent); font-size: 18px; }

/* Countdown ring for 20sec */
.mini-ring-wrap {
  display: flex;
  justify-content: center;
  margin-bottom: 14px;
}

/* Stats */
.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  width: 100%;
  margin-bottom: 16px;
}
.stat-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  text-align: center;
}
.stat-num { font-size: 24px; font-weight: 300; color: var(--accent); }
.stat-label { font-size: 11px; color: var(--text3); margin-top: 2px; }

/* History */
.history-label {
  font-size: 11px;
  color: var(--text3);
  letter-spacing: 0.08em;
  margin-bottom: 8px;
  align-self: flex-start;
}
.history-dots {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  align-self: flex-start;
}
.h-dot {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: var(--bg2);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
  color: var(--text3);
}
.h-dot.done { background: #0f2018; border-color: var(--accent); color: var(--accent); }
.h-dot.skip { background: #2a1f08; border-color: var(--warn); color: #f0a830; }

/* Install hint */
.install-hint {
  margin-top: 12px;
  padding: 10px 14px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 11px;
  color: var(--text3);
  text-align: center;
  display: none;
  width: 100%;
}
.install-hint.show { display: block; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-title">👁 20-20-20タイマー</div>
    <div class="header-rule">20-20-20ルール</div>
    <button class="sound-toggle on" id="soundBtn" onclick="toggleSound()">🔔</button>
  </div>

  <div class="content">

    <!-- ルール説明カード -->
    <div class="rule-cards">
      <div class="rule-card active">
        <div class="rule-num">20</div>
        <div class="rule-unit">分ごとに</div>
        <div class="rule-desc">作業したら</div>
      </div>
      <div class="rule-card">
        <div class="rule-num">20</div>
        <div class="rule-unit">フィート先</div>
        <div class="rule-desc">約6m以上</div>
      </div>
      <div class="rule-card">
        <div class="rule-num">20</div>
        <div class="rule-unit">秒間</div>
        <div class="rule-desc">見つめる</div>
      </div>
    </div>

    <!-- メインリング -->
    <div class="ring-wrap">
      <svg class="ring-svg" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="80" fill="none" stroke="var(--border)" stroke-width="10"/>
        <circle cx="100" cy="100" r="80" fill="none" id="arc"
          stroke="var(--accent)" stroke-width="10"
          stroke-dasharray="502.7" stroke-dashoffset="0"
          stroke-linecap="round" transform="rotate(-90 100 100)"/>
        <text x="100" y="92" text-anchor="middle" font-size="36" font-weight="300"
          fill="var(--text1)" font-family="-apple-system,sans-serif" id="timeText">20:00</text>
        <text x="100" y="116" text-anchor="middle" font-size="12"
          fill="var(--text2)" font-family="-apple-system,sans-serif" id="subText">作業中</text>
      </svg>
      <div class="status-text" id="statusText">開始ボタンで計測スタート</div>
    </div>

    <div class="alert" id="alertBar"></div>

    <div class="btn-row" id="mainBtns">
      <button class="btn primary" id="startBtn" onclick="toggleTimer()">▶ 開始</button>
      <button class="btn" onclick="resetTimer()">↺ リセット</button>
      <button class="btn sm" id="skipBtn" style="display:none" onclick="skipBreak()">スキップ</button>
    </div>

    <!-- 休憩パネル -->
    <div class="break-panel" id="breakPanel">
      <div class="break-title">👁 目を休めましょう</div>
      <div class="break-instruction">
        窓の外や遠い壁など<br>
        <strong>6m以上先</strong>を<br>
        <strong id="countdownNum">20</strong>秒間 見つめてください
      </div>
      <div class="mini-ring-wrap">
        <svg width="120" height="120" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="50" fill="none" stroke="var(--border)" stroke-width="8"/>
          <circle cx="60" cy="60" r="50" fill="none" id="miniArc"
            stroke="var(--accent)" stroke-width="8"
            stroke-dasharray="314.2" stroke-dashoffset="0"
            stroke-linecap="round" transform="rotate(-90 60 60)"/>
          <text x="60" y="68" text-anchor="middle" font-size="32" font-weight="300"
            fill="var(--text1)" font-family="-apple-system,sans-serif" id="miniTime">20</text>
        </svg>
      </div>
      <div class="btn-row">
        <button class="btn primary" onclick="finishBreak()">✓ 完了</button>
        <button class="btn" onclick="skipBreak()">スキップ</button>
      </div>
    </div>

    <!-- 統計 -->
    <div class="stats">
      <div class="stat-card">
        <div class="stat-num" id="cycleCount">0</div>
        <div class="stat-label">本日の休憩回数</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="skipCount">0</div>
        <div class="stat-label">スキップ回数</div>
      </div>
    </div>

    <div class="history-label">本日の記録（最大12回）</div>
    <div class="history-dots" id="historyDots">
      <!-- 12個のドット -->
    </div>

    <div class="install-hint" id="installHint">
      📱 ホーム画面に追加するとアプリのように使えます<br>
      Safari：共有ボタン →「ホーム画面に追加」<br>
      Chrome：メニュー →「アプリをインストール」
    </div>

  </div>
</div>

<script>
const WORK  = 20 * 60;  // 20分
const BREAK = 20;       // 20秒
const CIRC  = 2 * Math.PI * 80;
const MINI_CIRC = 2 * Math.PI * 50;

let running = false, inBreak = false, soundOn = true;
let workRemain = WORK, brkRemain = BREAK;
let workTid = null, brkTid = null;
let doneCount = 0, skipCount = 0;
let history = [];

// ── ドット初期化 ──
function initDots() {
  const wrap = document.getElementById('historyDots');
  wrap.innerHTML = '';
  for(let i=0; i<12; i++){
    const d = document.createElement('div');
    d.className = 'h-dot';
    d.textContent = '—';
    wrap.appendChild(d);
  }
}
initDots();

function fmt(s){ const m=Math.floor(s/60),sec=s%60; return `${m}:${sec.toString().padStart(2,'0')}`; }

function updateArc(remain, total, color){
  const pct = remain / total;
  const offset = CIRC * (1 - pct);
  const arc = document.getElementById('arc');
  arc.setAttribute('stroke-dashoffset', offset.toFixed(1));
  arc.setAttribute('stroke', color);
}

function updateMiniArc(remain){
  const pct = remain / BREAK;
  const offset = MINI_CIRC * (1 - pct);
  document.getElementById('miniArc').setAttribute('stroke-dashoffset', offset.toFixed(1));
  document.getElementById('miniTime').textContent = remain;
  document.getElementById('countdownNum').textContent = remain;
}

function showAlert(msg, ms=5000){
  const bar = document.getElementById('alertBar');
  bar.textContent = '🌿 ' + msg;
  bar.classList.add('show');
  if(ms) setTimeout(()=>bar.classList.remove('show'), ms);
}

function beep(type){
  if(!soundOn) return;
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const patterns = {
      alert: [[600,0.15],[800,0.15],[1000,0.2]],
      done:  [[800,0.12],[1000,0.12],[1200,0.15]],
    };
    let t = ctx.currentTime;
    (patterns[type]||[]).forEach(([freq,dur])=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value=freq;
      g.gain.setValueAtTime(0.25,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+dur);
      o.start(t); o.stop(t+dur);
      t+=dur+0.05;
    });
  }catch(e){}
}

function toggleSound(){
  soundOn = !soundOn;
  const btn = document.getElementById('soundBtn');
  btn.textContent = soundOn ? '🔔' : '🔕';
  btn.className = 'sound-toggle' + (soundOn?' on':'');
}

function updateStats(){
  document.getElementById('cycleCount').textContent = doneCount;
  document.getElementById('skipCount').textContent = skipCount;
}

function updateHistory(){
  const dots = document.getElementById('historyDots').querySelectorAll('.h-dot');
  history.forEach((h,i)=>{
    if(i < dots.length){
      dots[i].className = 'h-dot ' + (h==='done'?'done':'skip');
      dots[i].textContent = h==='done'?'✓':'–';
    }
  });
}

function startBreak(){
  inBreak = true; brkRemain = BREAK;
  document.getElementById('breakPanel').classList.add('show');
  document.getElementById('skipBtn').style.display = '';
  document.getElementById('alertBar').classList.remove('show');
  document.getElementById('timeText').textContent = '0:20';
  document.getElementById('subText').textContent = '休憩中';
  document.getElementById('statusText').textContent = '遠くを見て目を休めましょう👁';
  updateArc(BREAK, BREAK, '#3B8C4B');
  updateMiniArc(BREAK);
  beep('alert');
  if('Notification' in window && Notification.permission==='granted'){
    new Notification('20-20-20タイマー',{body:'20分経過！6m先を20秒見てください👁'});
  }
  brkTid = setInterval(()=>{
    brkRemain--;
    updateMiniArc(Math.max(0, brkRemain));
    updateArc(brkRemain, BREAK, '#3B8C4B');
    if(brkRemain <= 0){ clearInterval(brkTid); finishBreak(); }
  }, 1000);
}

function finishBreak(){
  clearInterval(brkTid); inBreak = false;
  doneCount++; history.push('done');
  updateStats(); updateHistory();
  document.getElementById('breakPanel').classList.remove('show');
  document.getElementById('skipBtn').style.display = 'none';
  workRemain = WORK;
  document.getElementById('timeText').textContent = fmt(WORK);
  document.getElementById('subText').textContent = '作業中';
  updateArc(WORK, WORK, '#3B8C4B');
  document.getElementById('statusText').textContent = 'お疲れさまでした！次まで20分あります';
  showAlert('休憩完了！また20分後にお知らせします');
  beep('done');
  if(running) workTid = setInterval(workTick, 1000);
}

function skipBreak(){
  clearInterval(brkTid); inBreak = false;
  skipCount++; history.push('skip');
  updateStats(); updateHistory();
  document.getElementById('breakPanel').classList.remove('show');
  document.getElementById('skipBtn').style.display = 'none';
  workRemain = WORK;
  document.getElementById('timeText').textContent = fmt(WORK);
  document.getElementById('subText').textContent = '作業中';
  updateArc(WORK, WORK, '#3B8C4B');
  document.getElementById('statusText').textContent = '作業中 — スキップしました';
  if(running) workTid = setInterval(workTick, 1000);
}

function workTick(){
  workRemain--;
  document.getElementById('timeText').textContent = fmt(workRemain);
  updateArc(workRemain, WORK, '#3B8C4B');
  if(workRemain <= 0){ clearInterval(workTid); startBreak(); }
}

function toggleTimer(){
  if(inBreak) return;
  running = !running;
  const btn = document.getElementById('startBtn');
  if(running){
    btn.textContent = '⏸ 一時停止'; btn.className = 'btn';
    document.getElementById('statusText').textContent = '作業中 — 20分後にお知らせします';
    document.getElementById('alertBar').classList.remove('show');
    workTid = setInterval(workTick, 1000);
    if('Notification' in window && Notification.permission==='default'){
      Notification.requestPermission();
    }
  } else {
    btn.textContent = '▶ 再開'; btn.className = 'btn primary';
    document.getElementById('statusText').textContent = '一時停止中';
    clearInterval(workTid);
  }
}

function resetTimer(){
  clearInterval(workTid); clearInterval(brkTid);
  running = false; inBreak = false; workRemain = WORK;
  document.getElementById('startBtn').textContent = '▶ 開始';
  document.getElementById('startBtn').className = 'btn primary';
  document.getElementById('timeText').textContent = '20:00';
  document.getElementById('subText').textContent = '作業中';
  document.getElementById('statusText').textContent = '開始ボタンで計測スタート';
  document.getElementById('breakPanel').classList.remove('show');
  document.getElementById('skipBtn').style.display = 'none';
  document.getElementById('alertBar').classList.remove('show');
  updateArc(WORK, WORK, '#3B8C4B');
}

// PWA
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

// スマホ判定
if(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)){
  document.getElementById('installHint').classList.add('show');
}

updateArc(WORK, WORK, '#3B8C4B');
</script>
</body>
</html>
